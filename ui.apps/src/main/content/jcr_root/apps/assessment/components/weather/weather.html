<sly data-sly-use.weatherModel="com.assessment.core.models.WeatherModel"></sly>
<div class="cmp-weather" data-city="${weatherModel.city @ context='attribute'}">
    <h2>${weatherModel.pageTitle @ context='html'}</h2>
    <div class="cmp-weather__data">
        <p>Weather for ${weatherModel.city}:</p>
        <pre>${weatherModel.weatherJson @ context='html'}</pre>
    </div>
</div>
