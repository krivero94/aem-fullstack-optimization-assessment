<div class="cmp-weather" data-sly-use.model="com.assessment.core.models.WeatherModel">
    <h2 class="cmp-weather__title">Weather Forecast</h2>
    
    <div data-sly-test="${model.weatherData}" class="cmp-weather__content">
        <div class="cmp-weather__current">
            <p>City: <strong>${model.city}</strong></p>
            <p>Temperature: <strong>${model.weatherData.temperature}</strong></p>
            <p>Status: ${model.weatherData.description}</p>
        </div>

        <div class="cmp-weather__forecast" data-sly-list.item="${model.weatherData.forecast}">
            <div class="cmp-weather__day">
                <span>Day ${item.day}: ${item.temperature} - ${item.wind}</span>
            </div>
        </div>
    </div>
    
    <div data-sly-test="${!model.weatherData}" class="cmp-weather__error">
        <p>Weather data currently unavailable.</p>
    </div>
</div>
